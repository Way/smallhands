name: Claude PR Review

# One review per PR, not one per push. `synchronize` used to re-trigger on every
# commit, which cost eight full reviews on a single PR (~$24). Re-review on demand
# via the Actions tab ("Run workflow" → PR number) or by reopening the PR.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    # A docs-only PR has nothing for a correctness/security review to find.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review'
        required: true
        type: string

# Cancel an in-flight review when the same PR is re-triggered — saves API spend
# and avoids stale review comments racing the latest push.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip drafts and bot-authored PRs (e.g. dependabot, agent-created PRs).
    # A manual dispatch is always deliberate, so it bypasses both checks.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.draft == false
          && github.event.pull_request.user.type != 'Bot')
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          # `head.sha` is unset on workflow_dispatch — fall back to the PR ref.
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr) }}
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Review instructions belong in `prompt`. `claude_args` is for CLI
          # flags only (--model, --effort, --allowedTools, …) — putting the
          # prompt there means the action runs with no instructions.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Review this pull request. Focus on:
            - Correctness and potential bugs
            - Security issues (XSS, injection, secrets, auth gaps)
            - Performance concerns
            - Code style consistency with the existing codebase

            Smallhands is a browser puzzle-strategy game built as a two-page
            static site: TypeScript compiled with Vite (`npm run build` runs
            `tsc --noEmit && vite build`), Canvas 2D for all rendering, and
            **zero runtime dependencies** — treat any new production dependency
            or CDN/network call as a red flag to call out. TypeScript is under
            `strict` with `noUnusedLocals`, `noUnusedParameters`,
            `noFallthroughCasesInSwitch` and `isolatedModules`; code is native
            ESNext modules (no default exports assumed), targeting ES2022.
            Source is split into `src/engine/` (reusable engine) and
            `src/game/` (game logic), with `src/main.ts` (the game at `/play/`)
            and `src/landing.ts` (the landing page at `/`) as entry points.
            Repo-specific invariants that matter more than generic style:
            (1) **Determinism** — the seeded procedural generator, the daily
            challenge and the weather forecast must stay deterministic; flag any
            `Math.random`/`Date.now`/wall-clock use that leaks into simulation
            or generation. (2) **i18n** — the game ships in English and German,
            so all player-facing text must go through the translation layer,
            never be hardcoded. (3) **Save format** — progress, medals and share
            codes (`SMH1.…`) live in localStorage; watch for changes that break
            backward compatibility of saved data or share codes. (4) **Bundle
            size** — the production build is ~22 kB gzipped; be wary of changes
            that bloat it. (5) **Sim vs. render split** — the render-only
            look-physics layer must not feed back into deterministic sim state.
            Tests are plain Node scripts (`tests/*.mjs`, run via `npm run
            test:*`), not a test framework — match that style.

            Scope your reading to the diff. Start with `gh pr diff`, then read
            only the files the diff touches plus their direct callers or
            callees when a change's correctness genuinely depends on them. Do
            not audit unrelated modules, do not read the full docs set (the
            repo's CLAUDE.md already loads AGENTS.md and docs/architecture.md
            for you), and do not re-read a file you have already read.

            Be concise. Only flag real issues — skip nitpicks the linter
            already enforces. The PR branch is already checked out.

            Post feedback as GitHub PR comments only — do not emit review text
            as chat messages. Use `gh pr comment` for top-level summary feedback
            and `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for line-specific findings. If the PR looks good,
            say so briefly.
          # --model: the action otherwise defaults to claude-opus-5[1m]
          # ($5/$25 per MTok). Sonnet 5 is near-Opus on coding and agentic work
          # at $2/$10 intro (through 2026-08-31), $3/$15 after.
          # --effort medium: reviews were running 68 turns / 11 minutes at the
          # default `high`.
          # Read/Grep/Glob are on the allowlist because the review needs them —
          # without them the run logged 12 permission denials, each a wasted
          # round trip.
          claude_args: |
            --model claude-sonnet-5
            --effort medium
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
